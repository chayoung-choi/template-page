        const tbody = document.getElementById('table-body');
        const buttons = document.querySelectorAll('.tab-btn');

        function renderTable(filter = 'all') {
            tbody.innerHTML = '';
            const filteredItems = filter === 'all' 
                ? data.items 
                : data.items.filter(item => item.category === filter);

            filteredItems.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="badge ${item.category}">${item.category}</span></td>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.sub}</td>
                    <td>${item.period}</td>
                    <td>${item.annual_usd ? '$' + item.annual_usd.toLocaleString() : '-'}</td>
                    <td class="krw">₩${item.annual_krw ? item.annual_krw.toLocaleString() : '-'}</td>
                    <td>${item.monthly_usd ? '$' + item.monthly_usd.toLocaleString() : '-'}</td>
                    <td class="krw">₩${item.monthly_krw ? item.monthly_krw.toLocaleString() : '-'}</td>
                    <td class="highlight">${item.first_payment ? '₩' + item.first_payment.toLocaleString() : '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderTable(btn.getAttribute('data-filter'));
            });
        });

        renderTable();
